# The egress proxy of the SentryTower compose example: the audit container
# reaches the model endpoint and nothing else. Add the host of another
# endpoint to model_endpoint when you change the base URL.
http_port 3128

acl model_endpoint dstdomain openrouter.ai
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny CONNECT !tls_port
http_access allow CONNECT model_endpoint
http_access deny all

# No cache and no request log: the requests hold source code.
cache deny all
access_log none
cache_log /dev/stderr
pid_filename none
