version: 2
# Each update waits a week after its release (cooldown): a compromised release is often found and
# pulled within days.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The Pi coding agent is pinned to the measured version: an update changes the model
  # requests, so it needs new measured runs. Dependabot reports security updates only.
  - package-ecosystem: npm
    directory: /docker/pi
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
