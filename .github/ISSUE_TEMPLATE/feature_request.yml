name: Feature request
description: Propose a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do that SentryTower does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: A change of the engines or of the model requests needs a new benchmark before it can be the default.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives that you considered
