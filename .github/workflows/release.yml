# The release of a version. It starts only when the owner pushes a tag vX.Y.Z that names the package
# version. It runs the tests, attaches the wheel and the source distribution to a GitHub release, and
# publishes the container image of the GitHub Action for linux/amd64 and linux/arm64 to
# ghcr.io/national-compute/sentrytower. In a public repository, each file and the image get a signed build
# provenance attestation; GitHub stores attestations of a private repository only on an Enterprise plan.
# There is no PyPI upload.
name: Release

on:
  push:
    # A version tag only (v0.1.0, v0.2.0rc1): a moved major tag such as v0 starts no release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/national-compute/sentrytower

jobs:
  check:
    name: Check the tag and run the tests
    if: github.repository == 'National-Compute/sentrytower'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check that the tag names the package version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::the tag ${TAG} does not name the package version ${version} of pyproject.toml"
            exit 1
          fi
          # A version with a letter (0.2.0rc1, 0.2.0b2, 0.2.0.dev1) is a pre-release.
          case "${version}" in
            *[a-z]*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if ! awk -v head="## [${version}]" 'index($0, head) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section ## [${version}] for the release notes"
            exit 1
          fi
          { echo "version=${version}"; echo "prerelease=${prerelease}"; } >> "$GITHUB_OUTPUT"
      - name: Install SentryTower and its development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests
      - name: mypy
        run: mypy
      - name: pytest (with the pin test, tests/test_release.py)
        run: pytest -q

  build:
    name: Build the wheel and the source distribution
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the OIDC token that signs the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - name: uv build
        run: uv build --out-dir dist
      - name: Check the files and write their checksums
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          test -f "dist/sentrytower-${VERSION}-py3-none-any.whl"
          test -f "dist/sentrytower-${VERSION}.tar.gz"
          (cd dist && sha256sum "sentrytower-${VERSION}-py3-none-any.whl" "sentrytower-${VERSION}.tar.gz" | tee SHA256SUMS)
      - name: Attest the build provenance of the wheel and the source distribution
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/sentrytower-*.whl
            dist/sentrytower-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/sentrytower-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  image:
    name: Build, test and push the image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # the OIDC token that signs the provenance attestation
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the linux/amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: sentrytower:smoke
      - name: Smoke test of the image with the fake endpoint
        run: |
          test "$(docker run --rm sentrytower:smoke --version)" = "sentrytower ${VERSION}"
          docker/smoke.sh sentrytower:smoke
      - name: Name the tags (latest only for a final version)
        id: tags
        run: |
          tags="${IMAGE}:${VERSION}"
          if [ "${PRERELEASE}" = false ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image for linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # GHCR reads the description and the source of a multi-platform image from the image index.
          annotations: |
            index:org.opencontainers.image.source=https://github.com/National-Compute/sentrytower
            index:org.opencontainers.image.description=SentryTower: LLM security audits of source repositories, with the pinned Pi CLI, ripgrep and fd.
            index:org.opencontainers.image.licenses=Apache-2.0 OR MIT
            index:org.opencontainers.image.version=${{ needs.check.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          # The build provenance and an SPDX SBOM of BuildKit, stored with the image.
          provenance: mode=max
          sbom: true
      - name: Attest the build provenance of the image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    name: Create the GitHub release
    needs: [check, build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and attach its files
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Write the release notes from CHANGELOG.md
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          notes="${RUNNER_TEMP}/notes.md"
          awk -v head="## [${VERSION}]" 'index($0, head) == 1 { take = 1; next } take && /^## \[/ { exit } take { print }' CHANGELOG.md > "${notes}"
          cat >> "${notes}" <<EOF

          ## Install

          \`\`\`sh
          git clone --branch v${VERSION} https://github.com/National-Compute/sentrytower && cd sentrytower && ./install.sh
          uv tool install git+https://github.com/National-Compute/sentrytower@v${VERSION}
          docker run --rm ${IMAGE}:${VERSION} --version
          \`\`\`

          GitHub Action: \`uses: National-Compute/sentrytower@v${VERSION}\`.
          EOF
          # The attestation steps run only in a public repository.
          if [ "${PRIVATE}" != true ]; then
            cat >> "${notes}" <<EOF

          Check the provenance of a file or of the image:

          \`\`\`sh
          gh attestation verify sentrytower-${VERSION}-py3-none-any.whl --repo National-Compute/sentrytower
          gh attestation verify oci://${IMAGE}:${VERSION} --repo National-Compute/sentrytower
          \`\`\`
          EOF
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [ "${PRERELEASE}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "SentryTower ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" "${flags[@]}" \
            "dist/sentrytower-${VERSION}-py3-none-any.whl" "dist/sentrytower-${VERSION}.tar.gz" dist/SHA256SUMS
