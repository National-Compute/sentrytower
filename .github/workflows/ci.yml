# The checks of each change: lint, types and tests on Python 3.11 to 3.14 on Linux and macOS, the
# container image and the GitHub Action against the fake model endpoint of the tests (no key, no model),
# and a secret scan of the tree and the history.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Fixed runner images: GitHub moves the -latest labels to a new system on its own schedule.
        os: [ubuntu-26.04, macos-26]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Node.js 22.6 or later runs the test of the repository guard (type stripping); without it the test skips.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install SentryTower and its development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest -q

  image:
    name: Container image and GitHub Action
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: make docker IMAGE=sentrytower:ci
      - name: Check that the image runs with no other tool
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(docker run --rm sentrytower:ci --version)" = "sentrytower ${version}"
          docker run --rm -e SENTRYTOWER_API_KEY=smoke sentrytower:ci doctor --offline --plain
      - name: Smoke test of the image with the fake endpoint
        run: docker/smoke.sh sentrytower:ci
      - name: Start the fake endpoint and an endpoint that refuses each key
        run: |
          python3 tests/smoke/fake_endpoint.py --host 0.0.0.0 --port 8099 >"${RUNNER_TEMP}/fake-endpoint.log" 2>&1 &
          python3 - 8098 401 >"${RUNNER_TEMP}/refusing-endpoint.log" 2>&1 <<'PY' &
          import sys
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


          class Refuse(BaseHTTPRequestHandler):
              def log_message(self, *_):
                  pass

              def do_POST(self):
                  self.rfile.read(int(self.headers.get("content-length") or 0))
                  body = b'{"error": {"message": "the key is not valid", "code": 401}}'
                  self.send_response(int(sys.argv[2]))
                  self.send_header("content-type", "application/json")
                  self.send_header("content-length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              do_GET = do_POST


          ThreadingHTTPServer(("0.0.0.0", int(sys.argv[1])), Refuse).serve_forever()
          PY
          for port in 8099 8098; do
            for _ in $(seq 1 100); do
              (exec 3<>"/dev/tcp/127.0.0.1/${port}") 2>/dev/null && break
              sleep 0.1
            done
          done
      - name: Smoke test of the Action
        id: action
        uses: ./ # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the newer $/ form
        with:
          api-key: smoke
          image: sentrytower:ci
          base-url: http://host.docker.internal:8099/v1
          docker-args: --add-host=host.docker.internal:host-gateway
          wall-clock: "900"
          upload-sarif: "false"
          upload-artifact: "false"
      - name: Check the outputs of the Action
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STATUS: ${{ steps.action.outputs.status }}
          ROUTE: ${{ steps.action.outputs.route }}
          FINDINGS: ${{ steps.action.outputs.findings }}
        run: |
          echo "exit code ${EXIT_CODE}, status ${STATUS}, route ${ROUTE}"
          test "${EXIT_CODE}" = 0 && test "${STATUS}" = complete && test "${ROUTE}" = funnel && test -f "${FINDINGS}"
      - name: Run the Action against the endpoint that refuses the key
        id: refused
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the newer $/ form
        with:
          api-key: smoke
          image: sentrytower:ci
          base-url: http://host.docker.internal:8098/v1
          docker-args: --add-host=host.docker.internal:host-gateway
          wall-clock: "300"
          upload-sarif: "false"
          upload-artifact: "false"
      - name: Check that a refused key fails the step with exit code 4
        env:
          OUTCOME: ${{ steps.refused.outcome }}
          EXIT_CODE: ${{ steps.refused.outputs.exit-code }}
          STATUS: ${{ steps.refused.outputs.status }}
        run: |
          echo "outcome ${OUTCOME}, exit code ${EXIT_CODE}, status ${STATUS}"
          test "${OUTCOME}" = failure && test "${EXIT_CODE}" = 4

  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          sudo install "${RUNNER_TEMP}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      # A Gitleaks configuration can switch detection off without an error (one with only an allowlist
      # replaces the default rules with none), so the rules this scan uses must report a planted token.
      - name: Check that the rules report a planted token
        run: |
          canary="$(mktemp -d)"
          python3 -c 'import secrets, string; print("GITHUB_TOKEN=ghp_" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)))' >"${canary}/canary.env"
          config=()
          if [ -f .gitleaks.toml ]; then config=(--config .gitleaks.toml); fi
          gitleaks dir "${canary}" "${config[@]}" --no-banner --redact --exit-code 0 \
            --report-format json --report-path "${canary}/report.json"
          python3 -c 'import json, sys; sys.exit(0 if any(f["RuleID"] == "github-pat" for f in json.load(open(sys.argv[1]))) else "the rules did not report a planted GitHub token")' "${canary}/report.json"
      - name: Scan the tree
        run: gitleaks dir . --no-banner --redact
      # A pull request: its own commits. Otherwise: the full history of the commit.
      - name: Scan the history
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT}" = pull_request ]; then range="${BASE}..${HEAD}"; else range="${GITHUB_SHA}"; fi
          gitleaks git . --no-banner --redact --log-opts="${range}"
